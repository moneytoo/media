name: Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29

      - uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - run: sudo apt-get update && sudo apt-get install -y ninja-build meson nasm

      - name: decoder_av1 - cpu_features
        uses: actions/checkout@v4
        with:
          repository: google/cpu_features
          ref: v0.9.0
          path: libraries/decoder_av1/src/main/jni/cpu_features

      - name: decoder_av1 - dav1d
        uses: actions/checkout@v4
        with:
          repository: videolan/dav1d
          ref: master
          path: libraries/decoder_av1/src/main/jni/dav1d

      - run: ./build_dav1d.sh
          ${{ github.workspace }}/libraries/decoder_av1/src/main
          ${{ steps.ndk.outputs.ndk-path }}
          $(uname -s | tr '[:upper:]' '[:lower:]')-x86_64
        working-directory: libraries/decoder_av1/src/main/jni

      - name: decoder_mpegh
        uses: actions/checkout@v4
        with:
          repository: Fraunhofer-IIS/mpeghdec
          ref: r2.0.1
          path: libraries/decoder_mpegh/src/main/jni/libmpegh

      - name: decoder_iamf
        uses: actions/checkout@v4
        with:
          repository: AOMediaCodec/iamf-tools
          ref: de364b983447a45d8be81f9172eea422c139dcf0
          path: libraries/decoder_iamf/src/main/jni/iamf_tools

      - run: ./build_iamf_tools.sh ${{ github.workspace }}/libraries/decoder_iamf/src/main
        working-directory: libraries/decoder_iamf/src/main/jni

      - name: decoder_ffmpeg
        uses: actions/checkout@v4
        with:
          repository: FFmpeg/FFmpeg
          ref: release/6.0
          path: libraries/decoder_ffmpeg/src/main/jni/ffmpeg

      - run: ./build_ffmpeg.sh
          ${{ github.workspace }}/libraries/decoder_ffmpeg/src/main
          ${{ steps.ndk.outputs.ndk-path }}
          $(uname -s | tr '[:upper:]' '[:lower:]')-x86_64
          21
          vorbis opus flac alac pcm_mulaw pcm_alaw mp3 amrnb amrwb aac ac3 eac3 dca mlp truehd
        working-directory: libraries/decoder_ffmpeg/src/main/jni

      - run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${GITHUB_WORKSPACE}/keystore.jks

      - run: ./gradlew assembleRelease
          -Pandroid.injected.signing.store.file=${GITHUB_WORKSPACE}/keystore.jks
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}
          -Pandroid.injected.signing.key.alias=key
          -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: libraries
          path: ${{ github.workspace }}/libraries/*/buildout/outputs/aar/*-release.aar

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ github.workspace }}/demos/*/buildout/outputs/apk/*/release/*.apk
            ${{ github.workspace }}/demos/*/buildout/outputs/apk/release/*.apk
          prerelease: true
          draft: true
